<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      height: 200em;
      background-color: black;
      display: flex;
    }
    .box{
      position: fixed;
      width: 50px;
      margin-top: 3em;
      margin-bottom: 59em;
      border-radius: 8px;
      background-color: rgb(252, 248, 248);
      color: rgb(0, 0, 0);
      font-size: 3em;
      font-weight: 900;
    }
    a{
      margin: 0.2em;
      margin-right: 2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <a>A</a>
      <a>B</a>
      <a>C</a>
      <a>D</a>
    </div>
  </div>
</body>
</html>
