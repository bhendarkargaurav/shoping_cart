<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid_CSS</title>
    <style>
        .container{
            display: grid;
            /* grid-template-columns: 2fr 2fr 2fr; */
           grid-template-columns: repeat(auto-fill, minmax(300px,3fr));
            /* grid-template-columns: repeat(2,2fr); */
            /* grid-template-columns: 200px 500px 200px; */
            /* grid-template-rows: 200px 500px 200px; */
            grid-gap: 10px ;
            /* grid-auto-rows: 100px;  this property used as to staying the size of box as 100px */
            grid-auto-rows:minmax(100px,auto);
            grid-auto-columns: minmax(100px,auto);
            
        }
            
        .items{
            background-color: chocolate;
            border: 3px solid rgb(75, 75, 71);
            text-align: center;
            font-size: 20px;
        }

        #item-1{
            grid-column-start:1;
            grid-column-end:5;
        }
/* 
        #item-5{
            grid-row-start:4 ;
            grid-row-end:8 ;
        } */
        .item-1-container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1-container" id="item-1">
            <div class="nested-item">Dabbe mai Dabba</div>
            <div class="nested-item">Dabbe mai Dabba</div>
            <div class="nested-item">Dabbe mai Dabba</div>
        </div>
        <div class="items" id="item-2">Dabba-2</div>
        <div class="items" id="item-3">Dabba-3</div>
        <div class="items" id="item-4">Dabba-4</div>
        <div class="items" id="item-5">Dabba-5</div>
    </div>
</body>
</html>
