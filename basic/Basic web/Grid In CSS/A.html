<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>challange-2</title>
    <style>
        .container{
            grid-template-columns: repeat(auto-fill,minmax(200px,10fr));
            display: grid;
            grid-gap: 5px;
            grid-auto-rows:minmax(50px,auto);
            grid-auto-columns: minmax(50px,auto);
            text-align: center;
            font-size: 30px;
            font-style: italic;
        }
        .items{
            background-color: rgb(225, 232, 46);
            border: 2px solid rgb(95, 95, 101);
            

        }
        .item-1{
            grid-column-start: 1;
            grid-column-end: 3;
           grid-row-start: 1;
           grid-row-end: 13;
           
        }
        
        .item-2{
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 3;
           /* grid-column-start: 2; */
           grid-column-end: 7;
        }
        .item-3{
            grid-row-start: 3;
           grid-row-end: 12;
            grid-column-start: 3;
           /* grid-column-start: 2; */
           grid-column-end: 7;
           
        }
        .item-4{
            grid-column-start: 6;
           grid-column-end: 7;
           grid-row-start: 3;
           grid-row-end: 11;
        }
        .item-5{
            grid-column-start: 3;
            /* grid-column-start: 2; */
           grid-column-end: 6;
           grid-row-start:3 ;
           grid-row-end:11;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">navigation</div>
        <div class="items item-2">header</div>
        <div class="items item-3">footer</div>
        <div class="items item-4">ads</div>
        <div class="items item-5">article</div>
    </div>
</body>
</html>
