<!DOCTYPE html>
<!-- How to convert the pic into circle or squre formate -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .clip-circle{
            clip-path: circle(46.0% at 50% 50%);
        }
        .clip-r{
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        }
        .clip-p{
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .clip-m{
            clip-path: ellipse(48% 50% at 50% 50%);

        }
        .clip.A{
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            box-shadow: inset ;
           background-attachment:scroll;

        }
        

    </style>
</head>
<body>
    <main>
        <div>
            <!-- for adding the save image into the web we have to simply save this image into the  -->
            <!-- same folder after that using img tag we have to pressing the slash (/). -->
            <img  class="clip-circle" src="/payment_form/img.jpg" height="200" alt="">
            <img  class="clip-r" src="/payment_form/img.jpg" height="200" alt="">
            <img  class="clip-p" src="/payment_form/img.jpg" height="200" alt="">
            <img  class="clip-m" src="/web with harry/mountain img.webp"   height="200" alt="">
            <img  class="clip.A" src="/web with harry/mountain img1.webp" alt="">
        </div>
        <br>
       
    </main>
</body>
</html>
