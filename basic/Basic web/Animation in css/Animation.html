<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .container{
            height: 100px;
            width: 100px;
            background-color: chocolate;
            transition: 2s, 4s, 3s, 5s;
        }
        .container:hover{
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <div class="container">

    </div>
</body>
</html>
