<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation1</title>
    <style>
        a{
            animation: bouncing 0.5s ease 0s infinite alternate both;
            background: blue;
            border-radius: 50%;
            display: inline-block;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2rem;
            padding: 1em 2em 1.1em;
            position: relative;
            text-decoration: none;
            text-transform: uppercase;
            vertical-align: top;
            margin-top: 100px;
        }

        @keyframes bouncing{
            0%{
                bottom: 0px;
                box-shadow:0 0 5px rgb(0, 0, 0, 0.9); 
            }
            100%{
                bottom: 60px;
                box-shadow:0 50px 50px rgb(0, 0, 0, 0.9); 
            }
        }
    </style>
</head>
<body>
    <div>
        <a>loading</a>
    </div>
</body>
</html>
